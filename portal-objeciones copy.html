function showScreen(name) {
  document.getElementById('screen-name').classList.toggle('hidden', name!=='name');
  document.getElementById('screen-portal').classList.toggle('hidden', name!=='portal');
  window.scrollTo(0,0);
}

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(LS_NAME);
  if (saved) document.getElementById('name-input').value = saved;
  loadUserPicker();
  renderTeoria();
});

async function loadUserPicker() {
  const listEl = document.getElementById('user-list');
  const emptyEl = document.getElementById('user-list-empty');
  try {
    const data = await gs('getUsers');
    const users = data.users || [];
    listEl.innerHTML = '';
    if (!users.length) { emptyEl.style.display='block'; }
    else {
      emptyEl.style.display='none';
      users.forEach(u => {
        const chip = document.createElement('button');
        chip.type='button'; chip.className='chip'; chip.textContent=u;
        chip.onclick = () => { document.getElementById('name-input').value = u; startFlow(); };
        listEl.appendChild(chip);
      });
    }
  } catch(e) { emptyEl.style.display='block'; emptyEl.textContent='No se pudo cargar la lista — escribe tu nombre.'; }
}

async function startFlow() {
  const input = document.getElementById('name-input');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  userName = name;
  localStorage.setItem(LS_NAME, name);
  try { await gs('registerUser', { name }); } catch(e) {}
  showScreen('portal');
  showMoment('teoria');
}

function showMoment(m) {
  ['teoria','ejercicios','simulador'].forEach(k => {
    document.getElementById('moment-'+k).classList.toggle('hidden', k!==m);
    document.getElementById('mtab-'+k).classList.toggle('active', k===m);
  });
  if (m === 'ejercicios') startEjercicio();
  if (m === 'simulador') renderAvatarPicker();
}

// ── MOMENTO 1: TEORÍA ───────────────────────────────────────────────────────
function renderTeoria() {
  document.getElementById('steps-grid').innerHTML = STEPS.map(s => `
    <div class="step-card"><div class="step-num">${s.num}</div><div class="step-title">${s.title}</div><div class="step-desc">${s.desc}</div></div>`).join('');
  document.getElementById('examples-list').innerHTML = EXAMPLES.map(ex => `
    <div class="example-card">
      <div class="example-objection"><span>Objeción</span>${ex.objection}</div>
      ${ex.lines.map(l => `<div class="example-line"><b>${l[0]}:</b><span>${l[1]}</span></div>`).join('')}
    </div>`).join('');
}

// ── MOMENTO 2: EJERCICIOS ───────────────────────────────────────────────────
function startEjercicio() {
  const objection = OBJECTION_POOL[Math.floor(Math.random()*OBJECTION_POOL.length)];
  objState = { objection };
  document.getElementById('ejercicio-view').innerHTML = `
    <div class="obj-card">
      <div class="obj-label">El prospecto te dice</div>
      <div class="obj-text">"${objection}"</div>
      <textarea id="obj-response" placeholder="Escribe tu respuesta completa, aplicando los 4 pasos..."></textarea>
      <button class="btn-primary" onclick="submitEjercicio()">Calificar mi respuesta</button>
    </div>`;
  loadRankingEjercicios();
}

async function submitEjercicio() {
  const textarea = document.getElementById('obj-response');
  const respuesta = textarea.value.trim();
  if (!respuesta) { textarea.focus(); return; }
  document.getElementById('ejercicio-view').innerHTML = `<div class="obj-card"><div class="obj-text">Calificando tu respuesta...</div></div>`;

  const system = `Eres un evaluador experto de técnicas de manejo de objeciones de ventas. La fórmula que se enseña tiene 4 pasos: 1) Validar (reconocer sin ceder, ej. "entiendo", "comprendo", "tienes razón"), 2) Explorar (hacer una pregunta que profundice en la raíz real de la objeción), 3) Explicar/Diferenciar/Reformular (dar una explicación o diferenciador concreto, ya con la raíz identificada), 4) Pregunta A/B de cierre (una pregunta de opción como "¿te hace sentido o...?", "¿es verdad?", "¿desea continuar?").
Evalúa si la respuesta del vendedor a la objeción "${objState.objection}" incluye cada uno de estos 4 elementos. Responde ÚNICAMENTE con JSON, sin texto adicional, sin backticks:
{"validar":true,"explorar":true,"explicar":true,"pregunta_ab":true,"feedback":"2-3 líneas de retroalimentación específica y constructiva, en español, tuteando"}`;

  try {
    const res = await fetch(API_BASE + '/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ system, messages:[{role:'user', content:`Respuesta del vendedor: "${respuesta}"`}], max_tokens:350 })
    });
    const data = await res.json();
    const raw = (data.content && data.content[0] && data.content[0].text) || '{}';
    const clean = raw.replace(/```json|```/g,'').trim();
    let parsed;
    try { parsed = JSON.parse(clean); } catch(e) { parsed = { validar:false, explorar:false, explicar:false, pregunta_ab:false, feedback:'No se pudo evaluar automáticamente esta vez.' }; }

    const elementos = [
      { key:'validar', label:'1. Validar', ok:!!parsed.validar },
      { key:'explorar', label:'2. Explorar', ok:!!parsed.explorar },
      { key:'explicar', label:'3. Explicar / Diferenciar', ok:!!parsed.explicar },
      { key:'pregunta_ab', label:'4. Pregunta A/B', ok:!!parsed.pregunta_ab },
    ];
    const count = elementos.filter(e=>e.ok).length;
    const score = count * 25;

    document.getElementById('ejercicio-view').innerHTML = `
      <div class="obj-card">
        <div class="obj-label">Objeción</div>
        <div class="obj-text" style="font-size:16px">"${objState.objection}"</div>
        <div class="grade-box">
          ${elementos.map(e => `<div class="grade-row ${e.ok?'ok':'missing'}"><span class="grade-icon">${e.ok?'✅':'❌'}</span> ${e.label}</div>`).join('')}
        </div>
        <div class="result-score" style="font-size:36px">${score}<span> /100 pts</span></div>
        <div class="feedback-box">
          <div class="feedback-label">Retroalimentación</div>
          <div class="feedback-text">${parsed.feedback || ''}</div>
        </div>
        <button class="btn-primary" onclick="startEjercicio()">🔁 Otra objeción</button>
      </div>`;

    try { await gs('objSubmit', { userName, objection: objState.objection, respuesta, score, detalle: parsed }); }
    catch(e) { console.error('No se pudo guardar el ejercicio', e); }
    loadRankingEjercicios();
  } catch (e) {
    document.getElementById('ejercicio-view').innerHTML = `<div class="obj-card"><div class="obj-text">Hubo un problema de conexión. <button class="btn-link" onclick="startEjercicio()">Reintentar</button></div></div>`;
  }
}

async function loadRankingEjercicios() {
  const listEl = document.getElementById('rank-ejercicios');
  try {
    const data = await gs('objResults');
    const hist = data.historial || [];
    const byUser = {};
    hist.forEach(h => { if(!byUser[h.userName]) byUser[h.userName]={total:0,count:0}; byUser[h.userName].total+=Number(h.score); byUser[h.userName].count+=1; });
    const rows = Object.keys(byUser).map(name => ({ name, avg: Math.round(byUser[name].total/byUser[name].count), count: byUser[name].count })).sort((a,b)=>b.avg-a.avg);
    if (!rows.length) { listEl.innerHTML = '<div class="rank-empty">Todavía no hay ejercicios registrados.</div>'; return; }
    const medals=['🥇','🥈','🥉'];
    listEl.innerHTML = rows.map((r,i)=>`<div class="rank-row"><div class="rank-pos">${medals[i]||(i+1)}</div><div><div class="rank-name">${r.name}</div><div class="rank-meta">${r.count} ejercicio${r.count===1?'':'s'}</div></div><div class="rank-score">${r.avg}<span style="font-size:11px;font-weight:600"> prom.</span></div></div>`).join('');
  } catch(e) { listEl.innerHTML = '<div class="rank-empty">No se pudo cargar el ranking.</div>'; }
}

// ── MOMENTO 3: SIMULADOR ─────────────────────────────────────────────────────
async function renderAvatarPicker() {
  const view = document.getElementById('simulador-view');
  view.innerHTML = `<div class="header" style="margin-bottom:1rem"><div class="subtitle">Elige tu prospecto — este avatar se bloquea solo para el simulador de objeciones</div></div><div class="avatar-grid" id="obj-avatar-grid"></div><div class="unlock-bar"><button class="btn-unlock" onclick="unlockObjAvatars()">🔓 Desbloquear mis avatares</button></div><div class="rank-section-title">🏆 Ranking del Simulador de Objeciones</div><div class="rank-list" id="rank-simulador"></div>`;
  try { const data = await gs('objSimLocks'); cachedLocks = data.locks || {}; } catch(e) {}
  renderObjAvatarGrid();
  loadRankingSimulador();
}

function renderObjAvatarGrid() {
  const locks = cachedLocks[userName] || {};
  const grid = document.getElementById('obj-avatar-grid');
  grid.innerHTML = AVATARS.map(a => {
    const isLocked = !!locks[a.id];
    const genderIcon = a.gender==='mujer'?'👩':'👨';
    return `<div class="avatar-card gender-${a.gender}${isLocked?' locked':''}" onclick="${isLocked?'':`pickObjAvatar('${a.id}')`}">
      <div class="avatar-name">${genderIcon} ${a.name}</div>
      <div class="avatar-tag">${SABE_LABEL[a.sabe]}</div>
      <div class="avatar-tag">${a.empresa}</div>
      <div class="avatar-tag">${a.dolor}</div>
      ${isLocked?'<div class="avatar-lock-note">🔒 Ya lo usaste aquí</div>':''}
    </div>`;
  }).join('');
}

async function pickObjAvatar(avatarId) {
  if (!cachedLocks[userName]) cachedLocks[userName] = {};
  if (!cachedLocks[userName][avatarId]) {
    cachedLocks[userName][avatarId] = true;
    try { await gs('objSimLockAvatar', { userName, avatarId }); } catch(e) {}
  }
  startObjSimulation(avatarId);
}

async function unlockObjAvatars() {
  if (!confirm('¿Desbloquear tus avatares del simulador de objeciones?')) return;
  delete cachedLocks[userName];
  try { await gs('objSimUnlockUser', { userName }); } catch(e) {}
  renderObjAvatarGrid();
}

function startObjSimulation(avatarId) {
  const avatar = AVATARS.find(a=>a.id===avatarId);
  simSession = { avatarId, touched:new Set(), turn:0, fallos:0, messages:[], finished:false };
  const genderIcon = avatar.gender==='mujer'?'👩':'👨';
  document.getElementById('simulador-view').innerHTML = `
    <button class="btn-back" onclick="backFromObjSim()">← Regresar</button>
    <div class="recap-card">
      <div class="recap-avatar-icon">${genderIcon}</div>
      <div><div class="recap-name">Le hablas a: ${avatar.name}</div>
      <div class="recap-tags"><span class="recap-tag">${SABE_LABEL[avatar.sabe]}</span><span class="recap-tag">${avatar.empresa}</span><span class="recap-tag">Objeta mucho — modo objeciones</span></div></div>
    </div>
    <div class="obj-card" style="padding:1rem 1.25rem">
      <div class="obj-label">Cómo arrancar</div>
      <div style="font-size:13.5px;line-height:1.5">Tú tienes que <b>provocar</b> la objeción — no esperes a que aparezca sola. Empieza con una pregunta que la despierte, ej: <i>"¿Está viendo otras opciones?"</i>, <i>"¿Qué le haría dudar de decidirse hoy?"</i>, <i>"¿Qué necesitaría ver de nosotros para avanzar?"</i>. De esa primera pregunta se arma todo el ejercicio.</div>
    </div>
    <div class="concept-bar" id="obj-concept-bar"></div>
    <div class="sim-status"><div class="sim-status-item">Turno <span id="obj-turn-count">0</span>/${MAX_TURNS}</div><div class="sim-status-item">Ciclos completos <span id="obj-acierto-count">0</span>/${NEEDED_ACIERTOS}</div></div>
    <div class="chat-box" id="obj-chat-box"></div>
    <div class="chat-input-row">
      <input type="text" class="chat-input" id="obj-chat-input" placeholder="Ej: ¿Está viendo otras opciones en este momento?" onkeydown="if(event.key==='Enter') sendObjMessage()">
      <button class="btn-send" id="obj-btn-send" onclick="sendObjMessage()">Enviar</button>
    </div>`;
  renderObjConceptBar();
  addObjBubble('avatar', '(tú arrancas — hazme una pregunta que despierte una objeción, y a partir de ahí seguimos)');
}

function backFromObjSim() {
  if (simSession && simSession.turn>0 && !confirm('¿Salir? Se pierde el progreso de este intento.')) return;
  renderAvatarPicker();
}

function renderObjConceptBar() {
  document.getElementById('obj-concept-bar').innerHTML = STEPS.map(s => {
    const t = simSession.touched.has(s.key);
    return `<span class="concept-chip${t?' touched':''}">${t?'✓ ':''}${s.title}</span>`;
  }).join('');
}
function renderObjStatus() {
  document.getElementById('obj-turn-count').textContent = simSession.turn;
  document.getElementById('obj-acierto-count').textContent = Math.min(simSession.cyclesDone||0, NEEDED_ACIERTOS);
}
function addObjBubble(who, text) {
  const box = document.getElementById('obj-chat-box');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (who==='vendedor'?'vendedor':'avatar');
  row.innerHTML = `<div class="msg-col"><div class="msg-label">${who==='vendedor'?'Tú':'Prospecto'}</div><div class="msg-bubble ${who==='vendedor'?'vendedor':'avatar'}">${text}</div></div>`;
  box.appendChild(row); box.scrollTop = box.scrollHeight;
  return row;
}

function buildObjPersonaPrompt() {
  const avatar = AVATARS.find(a=>a.id===simSession.avatarId);
  const pronombre = avatar.gender==='mujer'?'ella':'él';
  return `Eres un actor de roleplay. Actúas EXCLUSIVAMENTE como un prospecto de camiones difícil, que pone objeciones seguido (precio, "son chinos", desconfianza, comparación con la competencia como Sitrac, necesita consultar, no es el momento). Nunca salgas del personaje. Responde en español de México, texto plano, breve (1-3 frases), SIN JSON.
PERSONAJE: ${avatar.name} (${pronombre}), ${avatar.empresa}, su dolor: ${avatar.dolor}.
El vendedor va a arrancar provocando la objeción con una pregunta (ej. "¿está viendo otras opciones?"). En cuanto te pregunte algo así, suéltale una objeción real y específica que encaje con tu personaje — no te quedes vago ni evasivo, dile la objeción concreta.
De ahí en adelante: objeta de forma realista ante lo que te diga el vendedor — si su respuesta te convence de verdad (valida, explora, explica bien, y te pregunta con opciones), puedes ceder un poco o mostrarte más receptivo. Si su respuesta es floja o no contesta tu objeción, insiste o pon otra objeción.`;
}

function buildObjDetectorPrompt(vendorMsg, prevPersonaMsg) {
  const system = `Eres un evaluador. No actúas ningún personaje. Analiza el ÚLTIMO MENSAJE DEL VENDEDOR (en respuesta a una objeción del prospecto) y determina si contiene cada uno de estos 4 elementos de la fórmula de manejo de objeciones:
1) validar: reconoce sin ceder (ej. "entiendo", "comprendo", "tienes razón")
2) explorar: hace una pregunta que profundiza en la raíz de la objeción
3) explicar: da una explicación, diferenciador o reformulación concreta
4) pregunta_ab: cierra con una pregunta de opción (ej. "¿te hace sentido o...?", "¿es verdad?", "¿deseas continuar?")
Responde ÚNICAMENTE JSON sin texto adicional, sin backticks:
{"validar":true,"explorar":true,"explicar":true,"pregunta_ab":true,"ciclo_completo":true}
"ciclo_completo" es true SOLO si los 4 elementos están presentes en este mismo mensaje.`;
  const userMsg = `El prospecto acababa de decir: "${prevPersonaMsg || '(inicio)'}"\n\nEl vendedor respondió: "${vendorMsg}"`;
  return { system, userMsg };
}

async function sendObjMessage() {
  if (simSession.finished) return;
  const input = document.getElementById('obj-chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('obj-btn-send').disabled = true;

  const prevPersonaMsg = [...simSession.messages].reverse().find(m=>m.role==='assistant');
  addObjBubble('vendedor', text);
  simSession.messages.push({role:'user', content:text});
  const thinkingRow = addObjBubble('avatar', '<span class="msg-bubble thinking">escribiendo…</span>');

  try {
    const resPersona = await fetch(API_BASE + '/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ system: buildObjPersonaPrompt(), messages: simSession.messages, max_tokens:250 }) });
    const dataPersona = await resPersona.json();
    const personaMsg = ((dataPersona.content && dataPersona.content[0] && dataPersona.content[0].text) || '...').trim();
    thinkingRow.remove();
    addObjBubble('avatar', personaMsg);
    simSession.messages.push({role:'assistant', content:personaMsg});

    const { system: detSystem, userMsg: detUserMsg } = buildObjDetectorPrompt(text, prevPersonaMsg ? prevPersonaMsg.content : null);
    const resDet = await fetch(API_BASE + '/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ system: detSystem, messages:[{role:'user', content:detUserMsg}], max_tokens:150 }) });
    const dataDet = await resDet.json();
    const rawDet = (dataDet.content && dataDet.content[0] && dataDet.content[0].text) || '{}';
    let parsedDet;
    try { parsedDet = JSON.parse(rawDet.replace(/```json|```/g,'').trim()); } catch(e) { parsedDet = {}; }

    ['validar','explorar','explicar','pregunta_ab'].forEach(k => { if (parsedDet[k]) simSession.touched.add(k==='pregunta_ab'?'pregunta':k); });
    simSession.cyclesDone = simSession.cyclesDone || 0;
    const cicloCompleto = !!parsedDet.ciclo_completo;
    if (cicloCompleto) simSession.cyclesDone++;

    simSession.turn++;
    if (!cicloCompleto) simSession.fallos++;

    renderObjConceptBar();
    renderObjStatus();

    if (simSession.cyclesDone >= NEEDED_ACIERTOS) finishObjSimulation(true);
    else if (simSession.turn >= MAX_TURNS) finishObjSimulation(false);
  } catch(e) {
    thinkingRow.remove();
    addObjBubble('avatar', '(problema de conexión, intenta de nuevo)');
  }
  document.getElementById('obj-btn-send').disabled = false;
}

async function finishObjSimulation(success) {
  simSession.finished = true;
  let score;
  if (success) { score = (POINTS_TABLE[Math.min(simSession.fallos,3)]||20) * NEEDED_ACIERTOS; }
  else { score = simSession.cyclesDone * 10; }

  const avatar = AVATARS.find(a=>a.id===simSession.avatarId);
  document.getElementById('simulador-view').innerHTML = `
    <div class="result-card">
      <div class="result-icon">${success?'🏆':'😅'}</div>
      <div class="subtitle">${success?'¡Dominaste la objeción!':'No lo lograste — vuelve a intentarlo'}</div>
      <div class="result-score">${score}<span> pts</span></div>
      <div class="result-detail">${simSession.cyclesDone} ciclo(s) completo(s) de ${NEEDED_ACIERTOS} · ${simSession.fallos} turno(s) sin ciclo completo · ${simSession.turn} turnos usados</div>
      <div class="result-actions">
        <button class="btn-primary" style="width:auto" onclick="renderAvatarPicker()">🔁 Otro ejercicio</button>
      </div>
    </div>`;

  try { await gs('objSimSubmit', { userName, avatarName:avatar.name, score, aciertos:simSession.cyclesDone, fallos:simSession.fallos, success }); }
  catch(e) { console.error('No se pudo guardar', e); }
}

async function loadRankingSimulador() {
  const listEl = document.getElementById('rank-simulador');
  try {
    const data = await gs('objSimResults');
    const hist = data.historial || [];
    const byUser = {};
    hist.forEach(h => { if(!byUser[h.userName]) byUser[h.userName]={total:0,count:0}; byUser[h.userName].total+=Number(h.score); byUser[h.userName].count+=1; });
    const rows = Object.keys(byUser).map(name => ({ name, avg: Math.round(byUser[name].total/byUser[name].count), count: byUser[name].count })).sort((a,b)=>b.avg-a.avg);
    if (!rows.length) { listEl.innerHTML = '<div class="rank-empty">Todavía no hay ejercicios registrados.</div>'; return; }
    const medals=['🥇','🥈','🥉'];
    listEl.innerHTML = rows.map((r,i)=>`<div class="rank-row"><div class="rank-pos">${medals[i]||(i+1)}</div><div><div class="rank-name">${r.name}</div><div class="rank-meta">${r.count} ejercicio${r.count===1?'':'s'}</div></div><div class="rank-score">${r.avg}<span style="font-size:11px;font-weight:600"> prom.</span></div></div>`).join('');
  } catch(e) { listEl.innerHTML = '<div class="rank-empty">No se pudo cargar el ranking.</div>'; }
}
